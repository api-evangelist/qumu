name: Qumu
description: 'Qumu is an enterprise video management platform for creating, managing, and securely
  distributing live and on-demand video across large organizations, with features spanning live broadcasting,
  video content management, analytics, enterprise content delivery/eCDN, and AI-powered enhancements
  such as auto-generated summaries and video chapters. Qumu was acquired by Enghouse Systems in 2023 and
  is now operated as part of Enghouse Video; the qumu.com domain redirects to the Enghouse Video product
  page. No public developer portal, API reference, OpenAPI specification, or SDK surface is published.'
